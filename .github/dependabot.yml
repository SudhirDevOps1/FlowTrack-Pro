version: 2
updates:
  # ─── Desktop App Dependencies ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/desktop-app"
    schedule:
      interval: "monthly"
      day: "first sunday"
    open-pull-requests-limit: 1
    groups:
      desktop-dependencies:
        patterns:
          - "*"
    ignore:
      # Block all breaking major version bumps automatically to protect production app
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Web App Dependencies ──────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web-app"
    schedule:
      interval: "monthly"
      day: "first sunday"
    open-pull-requests-limit: 1
    groups:
      web-dependencies:
        patterns:
          - "*"
    ignore:
      # Block all breaking major version bumps automatically to protect production app
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions Workflows ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "first sunday"
    open-pull-requests-limit: 1
    groups:
      # Atomic grouping: CodeQL init, analyze & upload-sarif must always update together
      codeql-suite:
        patterns:
          - "github/codeql-action/*"
      github-actions:
        patterns:
          - "*"
    ignore:
      # Block breaking major updates on GitHub Actions to prevent sudden CI breakage
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
